[package]
name = "leansim"
version = "0.1.0"
edition = "2021"

[dependencies]
quinn = "0.11"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
bytes = "1.0"
hex-literal = "0.4"
rustls = { version = "0.23", features = ["ring"] }
clap = { version = "4.0", features = ["derive"] }
futures = "0.3"
dashmap = "5.0"
hashbrown = "0.14"
log = "0.4"
env_logger = "0.10"
rcgen = "0.13"

[patch.crates-io]
quinn-udp = { path = "patch/quinn-udp" }

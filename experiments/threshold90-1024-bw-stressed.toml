# Stressed-bandwidth counterpart of experiments/threshold90-1024-50-100.toml:
# non-supernodes get 10 Mbps up / 20 Mbps down, supernodes stay at 1000 Mbps.
# Brackets how much the 50/100 link budget of the requested scenario matters.
run_id = "threshold90-1024-bw-stressed"
run_timeout_secs = 60

validator_count = 1024
subnet_count = 1
local_aggregators_per_subnet = 32
global_aggregator_count = 0

local_threshold = 0.9
global_proof_target = 0.66
burst_time_ms = 100
burst_jitter_ms = 100

signature_aggregation_rate = 1000
global_aggregation_rate = 10
signature_payload_bytes = 1024
proof_payload_bytes = 131072

gossipsub_mesh_n_low = 4
gossipsub_mesh_n = 8
gossipsub_mesh_n_high = 12
gossipsub_mesh_outbound_min = 2
gossipsub_heartbeat_interval_ms = 300

use_geo_latency = true
geo_seed = 42
geo_jitter = 0.0

supernode_fraction = 0.05
supernode_uplink_mbps = 1000
supernode_downlink_mbps = 1000

topology_degree = 50

[network_defaults]
uplink_mbps = 10
downlink_mbps = 20
latency_ms = 50

[run]
runner = "docker"
runs = 1
parallelism = 10

[docker]
shadow_image = "kamilsa/shadow-arm:latest"
image_name = "leansim-shadow:local"
rebuild = false

[output]
dir = "output-threshold90-bw-stressed"

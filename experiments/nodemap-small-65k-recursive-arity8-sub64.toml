# Same network and committees as experiments/nodemap-small-65k-committees-sub64.toml
# (nodes_small.csv, all hosts, 65,536 validators in 64 committees of 1,024, lottery
# subnet aggregators), plus recursive aggregation: subnet proofs are announced to
# and pulled by 8-to-1 groups of attesters without a subnet duty (8/1
# groups over 2 layers) until one final proof remains.
run_id = "nodemap-small-65k-recursive-arity8-sub64"
run_timeout_secs = 120

validator_count = 65536
node_map = "nodes_small.csv"
all_hosts = true
subnet_subscriptions_per_node = 2
# Peers come only from subnet discovery: gossipsub_mesh_n per subscribed subnet
# and 2 per subnet a host only publishes in.
random_peer_count = 0
subnet_count = 64
local_aggregators_per_subnet = 16
committee_aggregators = true

recursive_aggregation = true
# 4 gives 16/4/1 groups, 8 gives 8/1. Set the time together with the arity.
recursive_aggregation_arity = 8
# Assumed: twice the 4-to-1 time, which is assumed twice the 2-to-1 time (leanVM 2-to-1 is 0.276 s on an M4 Max; 4-to-1 and 8-to-1 are not measured).
recursive_aggregation_time_ms = 1104
recursive_group_size = 16
recursive_proofs_per_child = 1
aggregate_proof_bytes = 262144

local_threshold = 0.9
burst_time_ms = 100
burst_jitter_ms = 100

signature_aggregation_rate = 1000
signature_payload_bytes = 1200

gossipsub_mesh_n_low = 4
gossipsub_mesh_n = 8
gossipsub_mesh_n_high = 12
gossipsub_mesh_outbound_min = 2
gossipsub_heartbeat_interval_ms = 300

use_geo_latency = true
geo_seed = 42
geo_jitter = 0.0

supernode_by_validator_count = 100
supernode_uplink_mbps = 1000
supernode_downlink_mbps = 1000

topology_degree = 50

[network_defaults]
uplink_mbps = 50
downlink_mbps = 100
latency_ms = 50

[run]
runner = "docker"
runs = 1
parallelism = 0  # all cores of the machine running Shadow

[docker]
shadow_image = "kamilsa/shadow-arm:latest"
image_name = "leansim-shadow:local"
rebuild = false

[output]
dir = "output-nodemap-small-65k-recursive-arity8-sub64"

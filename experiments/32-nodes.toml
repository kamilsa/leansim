# 32 nodes single-subnet experiment with geographical latencies
run_id = "32-nodes-geo"
run_timeout_secs = 120

validator_count = 32
subnet_count = 1
local_aggregators_per_subnet = 4
global_aggregator_count = 0

local_threshold = 0.9
global_proof_target = 0.66
burst_time_ms = 100
burst_jitter_ms = 100

signature_aggregation_rate = 1000
global_aggregation_rate = 10
signature_payload_bytes = 3072
proof_payload_bytes = 131072

gossipsub_mesh_n_low = 4
gossipsub_mesh_n = 6
gossipsub_mesh_n_high = 10
gossipsub_mesh_outbound_min = 2
gossipsub_heartbeat_interval_ms = 300

use_geo_latency = true
geo_seed = 42
geo_jitter = 0.0

supernode_fraction = 0.05
supernode_uplink_mbps = 1000
supernode_downlink_mbps = 1000

[network_defaults]
uplink_mbps = 50
downlink_mbps = 50
latency_ms = 50

[run]
runner = "docker" # docker | native
runs = 1
parallelism = 10

[docker]
shadow_image = "kamilsa/shadow-arm:latest"
image_name = "leansim-shadow:local"
rebuild = false

[output]
dir = "output"

# p95 time for hosts to hold 90% of a 1024-validator subnet's signatures, with validators
# sampled from located-map.csv onto shared hosts. 1200-byte signatures; non-supernodes
# 50 Mbps up / 100 Mbps down, 5% supernodes 1000 Mbps both ways. Seeds 42, 43, 44.
run_id = "located-1024-sig1200"
run_timeout_secs = 60

validator_count = 1024
# Sample validators and their physical peers from this map (path relative to the repo root).
validator_map = "located-map.csv"
subnet_count = 1
local_aggregators_per_subnet = 32
global_aggregator_count = 0

local_threshold = 0.9
global_proof_target = 0.66
burst_time_ms = 100
burst_jitter_ms = 100

signature_aggregation_rate = 1000
global_aggregation_rate = 10
signature_payload_bytes = 1200
proof_payload_bytes = 131072

gossipsub_mesh_n_low = 4
gossipsub_mesh_n = 8
gossipsub_mesh_n_high = 12
gossipsub_mesh_outbound_min = 2
gossipsub_heartbeat_interval_ms = 300

use_geo_latency = true
geo_seed = 42
geo_jitter = 0.0

supernode_fraction = 0.05
supernode_uplink_mbps = 1000
supernode_downlink_mbps = 1000

topology_degree = 50

[network_defaults]
uplink_mbps = 50
downlink_mbps = 100
latency_ms = 50

[run]
runner = "docker"
runs = 3
parallelism = 10

[docker]
shadow_image = "kamilsa/shadow-arm:latest"
image_name = "leansim-shadow:local"
rebuild = false

[output]
dir = "output-located-1024-sig1200"

# Single-subnet local aggregation experiment (BEAMSIM-style)
run_id = "local-agg-baseline"
run_timeout_secs = 60

validator_count = 32
subnet_count = 1
local_aggregators_per_subnet = 4

local_threshold = 0.9
burst_time_ms = 500
burst_jitter_ms = 500

signature_aggregation_rate = 1000
signature_payload_bytes = 3072

gossipsub_mesh_n_low = 2
gossipsub_mesh_n = 4
gossipsub_mesh_n_high = 6
gossipsub_mesh_outbound_min = 1
gossipsub_heartbeat_interval_ms = 1000

[network_defaults]
uplink_mbps = 50
downlink_mbps = 50
latency_ms = 50

[run]
runner = "docker" # docker | native
runs = 1
parallelism = 10

[docker]
shadow_image = "kamilsa/shadow-arm:latest"
image_name = "leansim-shadow:local"
rebuild = false

[output]
dir = "output"

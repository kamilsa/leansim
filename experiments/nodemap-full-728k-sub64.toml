# Full-scale mainnet-like run: every validator from nodes.csv (727,723) on all
# 13,613 observed physical nodes (10,902 validator hosts + all 2,711
# no_validator relay hosts), 64 subnets, 2 random subnet subscriptions per node.
# Validator co-location follows the real distribution (top node holds 19,524).
# Local aggregators are promoted from each subnet's subscribers (~425 per subnet).
# WARNING: full-scale estimate is ~1.5B SigReceived events (~200 GB of logs)
# and tens of GB of RAM; intended for a large host, not a laptop.
run_id = "nodemap-full-728k-sub64"
run_timeout_secs = 180

validator_count = 727680
# 727,723 validators from nodes.csv rounded down to 64 whole subnets: every
# subnet gets 11,370 validators, and 43 real validators are simply not sampled.
node_map = "nodes.csv"
subnet_subscriptions_per_node = 2
subnet_count = 64
local_aggregators_per_subnet = 16

local_threshold = 0.9
burst_time_ms = 100
burst_jitter_ms = 100

signature_aggregation_rate = 1000
signature_payload_bytes = 1200

gossipsub_mesh_n_low = 4
gossipsub_mesh_n = 8
gossipsub_mesh_n_high = 12
gossipsub_mesh_outbound_min = 2
gossipsub_heartbeat_interval_ms = 300

use_geo_latency = true
geo_seed = 42
geo_jitter = 0.0

supernode_by_validator_count = 100
supernode_uplink_mbps = 1000
supernode_downlink_mbps = 1000

topology_degree = 50

[network_defaults]
uplink_mbps = 50
downlink_mbps = 100
latency_ms = 50

[run]
runner = "docker"
runs = 1
parallelism = 0  # all cores of the machine running Shadow

[docker]
shadow_image = "kamilsa/shadow-arm:latest"
image_name = "leansim-shadow:local"
rebuild = false

[output]
dir = "output-nodemap-full-728k-sub64"

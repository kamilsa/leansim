# Time to reach the 90% subnet signature threshold with the requested bandwidth matrix:
# non-supernodes 50 Mbps up / 100 Mbps down, 5% supernodes 1000 Mbps both directions,
# 1024-byte signature payloads. Single subnet of 1024 validators, 32 local aggregators.
run_id = "threshold90-1024-50-100"
run_timeout_secs = 60

validator_count = 1024
subnet_count = 1
local_aggregators_per_subnet = 32

local_threshold = 0.9
burst_time_ms = 100
burst_jitter_ms = 100

signature_aggregation_rate = 1000
signature_payload_bytes = 1024

gossipsub_mesh_n_low = 4
gossipsub_mesh_n = 8
gossipsub_mesh_n_high = 12
gossipsub_mesh_outbound_min = 2
gossipsub_heartbeat_interval_ms = 300

use_geo_latency = true
geo_seed = 42
geo_jitter = 0.0

supernode_fraction = 0.05
supernode_uplink_mbps = 1000
supernode_downlink_mbps = 1000

topology_degree = 50

[network_defaults]
uplink_mbps = 50
downlink_mbps = 100
latency_ms = 50

[run]
runner = "docker"
runs = 1
parallelism = 10

[docker]
shadow_image = "kamilsa/shadow-arm:latest"
image_name = "leansim-shadow:local"
rebuild = false

[output]
dir = "output-threshold90"

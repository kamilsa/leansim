run_id = "local-256"
run_timeout_secs = 120

validator_count = 256
subnet_count = 1
local_aggregators_per_subnet = 16

local_threshold = 0.9
burst_time_ms = 100
burst_jitter_ms = 100

signature_aggregation_rate = 1000
signature_payload_bytes = 3072

gossipsub_mesh_n_low = 4
gossipsub_mesh_n = 6
gossipsub_mesh_n_high = 10
gossipsub_mesh_outbound_min = 2
gossipsub_heartbeat_interval_ms = 300

[network_defaults]
uplink_mbps = 50
downlink_mbps = 50
latency_ms = 50

[run]
runner = "docker" # docker | native
runs = 1
parallelism = 10

[docker]
shadow_image = "kamilsa/shadow-arm:latest"
image_name = "leansim-shadow:local"
rebuild = false

[output]
dir = "output"

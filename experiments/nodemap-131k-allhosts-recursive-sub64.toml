# 131,072 validators on all 13,613 nodes of nodes.csv (as
# experiments/nodemap-131k-allhosts-sub64.toml: 64 committees of 2,048, no duty
# subnet subscriptions, subnet-only 8/8 peering) with the 65k recursive setup of
# experiments/nodemap-small-65k-recursive-sub64.toml: lottery committee
# aggregators and 2-to-1 recursive aggregation (32/16/8/4/2/1 groups over 6
# layers) until one final proof remains. Traffic logs cover supernodes of
# different sizes, regular hosts, a relay, and hosts with subnet and recursive
# duties at different (and multiple) layers.
run_id = "nodemap-131k-allhosts-recursive-sub64"
run_timeout_secs = 120

validator_count = 131072
node_map = "nodes.csv"
all_hosts = true
subnet_subscriptions_per_node = 2
# Every host keeps just its 2 random gossip subnets (plus the subnets it
# aggregates): duty subscriptions put big operators on ~60 subnets and need
# more than 503 GB at this scale.
subscribe_to_duty_subnets = false
# Peers come only from subnet discovery ("8/8"): gossipsub_mesh_n per subscribed
# subnet and publish_subnet_peer_count per subnet a host only publishes in.
random_peer_count = 0
publish_subnet_peer_count = 8
subnet_count = 64
local_aggregators_per_subnet = 16
committee_aggregators = true

recursive_aggregation = true
recursive_aggregation_arity = 2
# leanVM's 2-to-1 recursion: 0.276 s on an M4 Max.
recursive_aggregation_time_ms = 276
recursive_group_size = 16
recursive_proofs_per_child = 1
aggregate_proof_bytes = 262144

# Traffic logs (seed 42 node ids): supernodes 12950 (3,480 validators, subnet +
# recursive layers 1-4), 5188 (995, subnets + layers 1/2/5), 3077 (355, layers
# 1/3/5), 6404 (192, no duty), 4645 (154, no duty), 8093 (72, subnet aggregator
# only); regular 7909 (24), 2725 (1), relay 0; regular aggregators 3115 (1
# subnet), 3438/3635/5838/4937 (recursive layer 1/3/5/6).
traffic_log_nodes = [0, 2725, 3077, 3115, 3438, 3635, 4645, 4937, 5188, 5838, 6404, 7909, 8093, 12950]
traffic_log_bucket_ms = 100

local_threshold = 0.9
burst_time_ms = 100
burst_jitter_ms = 100

signature_aggregation_rate = 1000
signature_payload_bytes = 1200

gossipsub_mesh_n_low = 4
gossipsub_mesh_n = 8
gossipsub_mesh_n_high = 12
gossipsub_mesh_outbound_min = 2
gossipsub_heartbeat_interval_ms = 300
# Every host warms up 3 s before signing: about 2 round trips on the slowest
# links (up to 259 ms one-way) to learn subscriptions, then a heartbeat to graft
# meshes. The launcher's dial-count rule would pick 1,500 ms here, which cuts it
# close on intercontinental links.
mesh_warmup_ms = 3000

use_geo_latency = true
geo_seed = 42
geo_jitter = 0.0

supernode_by_validator_count = 100
supernode_uplink_mbps = 1000
supernode_downlink_mbps = 1000

topology_degree = 50

[network_defaults]
uplink_mbps = 50
downlink_mbps = 100
latency_ms = 50

[run]
runner = "native"  # local cargo build + shadow on PATH
runs = 1
parallelism = 0  # all cores of the machine running Shadow

[output]
dir = "output-nodemap-131k-allhosts-recursive-sub64"

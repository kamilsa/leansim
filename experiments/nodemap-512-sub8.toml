# Ethereum-style topology: hosts, validator co-location, and the no_validator relay
# share are sampled from nodes.csv (node_map); every node subscribes to 2 random
# subnets (subnet_subscriptions_per_node), independent of the subnets its validators
# publish to. Local aggregators are promoted from each subnet's subscribers.
# 512 validators, 8 subnets, 1200-byte signatures, 50/100 Mbps non-supernodes.
run_id = "nodemap-512-sub8"
run_timeout_secs = 60

validator_count = 512
node_map = "nodes.csv"            # path relative to the repo root
subnet_subscriptions_per_node = 2
subnet_count = 8
local_aggregators_per_subnet = 4
global_aggregator_count = 0

local_threshold = 0.9
global_proof_target = 0.66
burst_time_ms = 100
burst_jitter_ms = 100

signature_aggregation_rate = 1000
global_aggregation_rate = 10
signature_payload_bytes = 1200
proof_payload_bytes = 131072

gossipsub_mesh_n_low = 4
gossipsub_mesh_n = 8
gossipsub_mesh_n_high = 12
gossipsub_mesh_outbound_min = 2
gossipsub_heartbeat_interval_ms = 300

use_geo_latency = true
geo_seed = 42
geo_jitter = 0.0

supernode_fraction = 0.05
supernode_uplink_mbps = 1000
supernode_downlink_mbps = 1000

topology_degree = 50

[network_defaults]
uplink_mbps = 50
downlink_mbps = 100
latency_ms = 50

[run]
runner = "docker"
runs = 1
parallelism = 10

[docker]
shadow_image = "kamilsa/shadow-arm:latest"
image_name = "leansim-shadow:local"
rebuild = false

[output]
dir = "output-nodemap-512-sub8"

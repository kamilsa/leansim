# 32k network of the hosts that run validators (all_hosts = false), as
# sweeps/32k/jobs/bundled-m8.toml, with churn: every 100 ms tick an online churny
# host crashes with probability 0.01 and an offline one rejoins with 0.05
# (10 s sessions, 2 s gaps). A crash is silent and a rejoining host has no state
# but its peer table. 20% of the regular hosts churn; supernodes stay online.
# Signature propagation only, no aggregators.
# Configuration: bundled-m8-churn20.
run_id = "32k-valhosts-sub16-bundled-m8-churn20"
run_timeout_secs = 25

validator_count = 32768
node_map = "nodes.csv"
all_hosts = false
subnet_subscriptions_per_node = 2
subscribe_to_duty_subnets = false
random_peer_count = 0
publish_subnet_peer_count = 8
subnet_count = 16
# No aggregation step: only propagation is measured.
local_aggregators_per_subnet = 0
local_threshold = 0.9
burst_time_ms = 100
burst_jitter_ms = 100
signature_payload_bytes = 1200

gossipsub_mesh_n_low = 4
gossipsub_mesh_n = 8
gossipsub_mesh_n_high = 12
gossipsub_mesh_outbound_min = 2
gossipsub_heartbeat_interval_ms = 300
mesh_warmup_ms = 3000
gossipsub_idontwant_threshold_bytes = 1000
signature_propagation = "bundled"
bundle_tick_ms = 20
bundle_max_signatures = 50

churn_tick_ms = 100
regular_churn_fraction = 0.2
regular_churn_leave_probability = 0.01
regular_churn_rejoin_probability = 0.05
supernode_churn_fraction = 0.0
supernode_churn_leave_probability = 0.01
supernode_churn_rejoin_probability = 0.05

use_geo_latency = true
geo_seed = 42
geo_jitter = 0.0
supernode_by_validator_count = 10
supernode_uplink_mbps = 1000
supernode_downlink_mbps = 1000
topology_degree = 50

[network_defaults]
uplink_mbps = 50
downlink_mbps = 100
latency_ms = 50

[run]
runner = "native"
runs = 1
parallelism = 24
cpu_pinning = false

[output]
dir = "/home/kamilsa/dev/leansim-churn/output-32k-valhosts/bundled-m8-churn20"
